devices:
  - name: "cp_member_1"
    role: "cp-cluster-member"
    ip: "10.226.199.4"
    login: "admin"
    password_env_var: "CHECKPOINT_DEVICE1_PASSWORD"
    expert_password_env_var: "CHECKPOINT_DEVICE1_EXPERT_PASSWORD"
    ssh_key_path: "~/.ssh/id_rsa"

  - name: "aruba_vsx_node"
    role: "aruba-vsx-node"
    ip: "10.226.199.5"
    login: "admin"
    password_env_var: "ARUBA_DEVICE2_PASSWORD"
    ssh_key_path: "~/.ssh/id_aruba"

# Main polling loop interval, in seconds. Keep this conservative (30-60s) --
# this polls control-plane state on live production infrastructure during a
# cutover, and added load during a change window is itself a risk. Do NOT
# set this below ~10s.
interval: 60

# Optional: a Slack/Teams-compatible incoming webhook URL. If left blank,
# monitor.py falls back to a local terminal bell + highlighted console line.
webhook_url: ""

# Thresholds used by the individual checks in monitor.py
thresholds:
  clusterxl_flap_max_changes: 2
  clusterxl_flap_window_seconds: 120

  neighbor_loss_grace_seconds: 180

  vip_packet_loss_pct_threshold: 0.5
  vip_latency_increase_pct_threshold: 50

  interface_error_pct_threshold: 1.0
  interface_consecutive_flap_polls: 2

# The bounded "fw ctl zdebug + drop" asymmetric-routing check is
# deliberately run on its OWN, much slower interval -- running a debug
# capture every single poll cycle would itself be too disruptive to run
# continuously during a maintenance window.
asymmetric_routing_burst_interval_seconds: 300
asymmetric_routing_burst_max_duration_seconds: 10
